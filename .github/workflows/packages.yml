name: Build Release Binaries

on:
  workflow_call:
    inputs:
      upload:
        description: "Upload to release (requires a release to exist)"
        required: false
        default: "false"
        type: string
      tag:
        description: "Release tag to upload to (only if upload is true)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to release (requires a release to exist)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      tag:
        description: "Release tag to upload to (only if upload is true)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write # mint the OIDC token for keyless provenance signing
      attestations: write # store the build provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc) — built with cargo-zigbuild against an old
          # glibc floor so the binary runs on distros older than the runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: "2.17"
            build_packages: true

          # Linux ARM64 (glibc)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            glibc: "2.17"
            build_packages: true

          # Linux x86_64 (musl)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

          # Linux ARM64 (musl)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-15-intel

          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest

          # Windows ARM64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          prefix-key: "v1-rust"

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Pin the glibc symbol-version floor (link-time only; the binary still
      # uses the host's glibc at runtime) so it runs on distros older than the
      # CI runner.
      - name: Install Zig
        if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.glibc
        run: cargo install --locked cargo-zigbuild

      - name: Build release binary (zigbuild)
        if: matrix.glibc
        run: cargo zigbuild --release --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Build release binary
        if: ${{ !matrix.glibc }}
        run: cargo build --release --target ${{ matrix.target }}

      # Regression guard: fail if the binary ever requires a glibc newer than
      # the declared floor.
      - name: Verify glibc floor
        if: matrix.glibc
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/badness"
          max=$(objdump -T "$bin" 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sed 's/GLIBC_//' | sort -V | tail -n1 || true)
          echo "Highest required glibc symbol: ${max:-none}"
          if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$max" "${{ matrix.glibc }}" | sort -V | tail -n1)" != "${{ matrix.glibc }}" ]; then
            echo "::error::badness requires glibc $max, above the ${{ matrix.glibc }} floor"
            exit 1
          fi

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/badness

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/badness dist/
          cp LICENSE dist/
          cp README.md dist/
          tar czf badness-${{ matrix.target }}.tar.gz -C dist .
          rm -rf dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum badness-${{ matrix.target }}.tar.gz > badness-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 badness-${{ matrix.target }}.tar.gz > badness-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/${{ matrix.target }}/release/badness.exe dist/
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath badness-${{ matrix.target }}.zip
          Remove-Item -Recurse -Force dist
          $asset = "badness-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$asset.sha256" -Value "$hash  $asset" -Encoding ascii

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: badness-${{ matrix.target }}
          path: |
            badness-${{ matrix.target }}.tar.gz
            badness-${{ matrix.target }}.zip
            badness-${{ matrix.target }}.tar.gz.sha256
            badness-${{ matrix.target }}.zip.sha256

      # Sign a build provenance attestation for the archive, verifiable with
      # `gh attestation verify`. Only on real release uploads.
      - name: Attest build provenance (Unix)
        if: inputs.upload == 'true' && runner.os != 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: badness-${{ matrix.target }}.tar.gz

      - name: Attest build provenance (Windows)
        if: inputs.upload == 'true' && runner.os == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: badness-${{ matrix.target }}.zip

      - name: Upload binary to release
        if: inputs.upload == 'true'
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -f badness-${{ matrix.target }}.tar.gz ]; then
            gh release upload --clobber "$TAG" \
              badness-${{ matrix.target }}.tar.gz \
              badness-${{ matrix.target }}.tar.gz.sha256
          fi
          if [ -f badness-${{ matrix.target }}.zip ]; then
            gh release upload --clobber "$TAG" \
              badness-${{ matrix.target }}.zip \
              badness-${{ matrix.target }}.zip.sha256
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach the platform installer scripts once (they are repo files, not
      # per-target build outputs) so the README one-liners resolve them.
      - name: Upload installer scripts to release
        if: inputs.upload == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          gh release upload --clobber "$TAG" \
            scripts/badness-installer.sh \
            scripts/badness-installer.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux glibc targets also ship .deb and .rpm packages. The binary is
      # already built above; cargo-deb runs with --no-build so it packages that
      # artifact rather than rebuilding. Both tools read the asset lists from
      # [package.metadata.deb] and [package.metadata.generate-rpm] in Cargo.toml.
      - name: Install cargo-deb and cargo-generate-rpm
        if: matrix.build_packages == true
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build DEB package
        if: matrix.build_packages == true
        run: |
          rm -rf target/${{ matrix.target }}/debian
          cargo deb --target ${{ matrix.target }} --no-build

      - name: Build RPM package
        if: matrix.build_packages == true
        run: |
          rm -rf target/${{ matrix.target }}/generate-rpm
          cargo generate-rpm --target ${{ matrix.target }}

      - name: Collect package files
        if: matrix.build_packages == true
        run: |
          DEB_FILE=$(ls target/${{ matrix.target }}/debian/*.deb)
          RPM_FILE=$(ls target/${{ matrix.target }}/generate-rpm/*.rpm)
          cp "$DEB_FILE" "$RPM_FILE" .

      - name: Upload package artifacts (for testing)
        if: matrix.build_packages == true
        uses: actions/upload-artifact@v7
        with:
          name: badness-packages-${{ matrix.target }}
          path: |
            *.deb
            *.rpm

      - name: Attest package provenance
        if: matrix.build_packages == true && inputs.upload == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.deb
            *.rpm

      - name: Upload packages to release
        if: matrix.build_packages == true && inputs.upload == 'true'
        run: |
          TAG="${{ inputs.tag }}"
          gh release upload --clobber "$TAG" *.deb *.rpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish a SHA256SUMS manifest covering every asset attached to the release.
  # Runs after all per-target build jobs so all assets are already uploaded.
  # Guards against accidental corruption and lets installers verify downloads;
  # it is not a substitute for signing/provenance.
  checksums:
    name: Publish SHA256SUMS
    needs: build-binaries
    if: inputs.upload == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          # Pull every asset already on the release, dropping any SHA256SUMS
          # from a prior run so the manifest never checksums itself.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber "$TAG" SHA256SUMS
