name: Bug report
description: A crash, a losslessness or idempotence violation, wrong output, or LSP misbehavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Losslessness (`reconstruct == input`) and idempotence (formatting twice
        equals formatting once) are core invariants; violations of either are
        always bugs.

  - type: dropdown
    id: kind
    attributes:
      label: Kind of bug
      options:
        - Crash / panic
        - Losslessness violation (reconstruct != input)
        - Non-idempotent formatting
        - Wrong or missing diagnostic
        - Incorrect formatting output
        - LSP misbehavior
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong.
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input .tex
      description: The smallest source that reproduces the bug.
      render: tex
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: badness.toml settings
      description: Any relevant configuration. Leave blank if you used the defaults.
      render: toml

  - type: textarea
    id: actual
    attributes:
      label: Actual output
      render: tex

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      render: tex

  - type: textarea
    id: version
    attributes:
      label: Command, version, and OS
      description: e.g. `badness format file.tex`; output of `badness --version`; your OS.
    validations:
      required: true
