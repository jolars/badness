[workspace]
members = [
    "crates/badness-parser",
    "crates/badness-formatter",
    "crates/badness-wasm",
]
exclude = ["docs/doc-utils"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jolars/badness"
authors = ["Johan Larsson <johan@jolars.co>"]

[package]
name = "badness"
version = "0.19.0"
edition.workspace = true
readme = "README.md"
description = "A language server, formatter, and linter for LaTeX"
license.workspace = true
repository.workspace = true
homepage = "https://badness.dev/"
documentation = "https://badness.dev"
authors.workspace = true
include = ["/src/**/*", "/build.rs", "/README.md", "/LICENSE"]
keywords = ["latex", "language-server", "formatter", "linter"]
categories = [
    "command-line-utilities",
    "text-processing",
    "parsing",
    "parser-implementations",
]

# `benches/sites.rs` is a module the bench binaries share, not a bench of its own.
# Cargo would otherwise auto-discover it as a target, so every bench is declared
# explicitly below.
autobenches = false

[lib]
name = "badness"

[[bin]]
name = "badness"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.12.16"
badness-formatter = { path = "crates/badness-formatter", version = "0.6.0" }
badness-parser = { path = "crates/badness-parser", version = "0.5.0" }
clap = { version = "4.5.51", features = ["derive"] }
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
ignore = "0.4.26"
log = { version = "0.4.32", features = ["release_max_level_info"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
memchr = "2.8.3"
rayon = "1.10.0"
rowan = "0.17.0"
salsa = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.1.1", features = ["text"] }
smol_str = "0.3.2"
toml = "1.1.4"

[build-dependencies]
clap = { version = "4.5.51", features = ["derive"] }
clapdown = "0.2.0"
clap_complete = "4.6.5"
clap_mangen = "0.3.0"

[package.metadata.deb]
maintainer = "Johan Larsson <johan@jolars.co>"
copyright = "2026, Johan Larsson <johan@jolars.co>"
license-file = ["LICENSE", "4"]
extended-description = """\
Badness is a formatter, linter, and language server for LaTeX. It formats \
.tex, .sty/.cls, .dtx/.ins, and .bib files with deterministic, rule-based \
layout, reports diagnostics with optional autofixes, and exposes an integrated \
language server for editor support."""
depends = "$auto"
section = "text"
priority = "optional"
assets = [
    [
        "target/release/badness",
        "usr/bin/",
        "755",
    ],
    [
        "README.md",
        "usr/share/doc/badness/",
        "644",
    ],
    [
        "LICENSE",
        "usr/share/doc/badness/",
        "644",
    ],
    [
        "target/man/*.1",
        "usr/share/man/man1/",
        "644",
    ],
    [
        "target/completions/badness.bash",
        "usr/share/bash-completion/completions/badness",
        "644",
    ],
    [
        "target/completions/badness.fish",
        "usr/share/fish/vendor_completions.d/badness.fish",
        "644",
    ],
    [
        "target/completions/_badness",
        "usr/share/zsh/vendor-completions/_badness",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/badness", dest = "/usr/bin/badness", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/badness/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/badness/LICENSE", mode = "644", doc = true },
    { source = "target/man/*.1", dest = "/usr/share/man/man1/", mode = "644" },
    { source = "target/completions/badness.bash", dest = "/usr/share/bash-completion/completions/badness", mode = "644" },
    { source = "target/completions/badness.fish", dest = "/usr/share/fish/vendor_completions.d/badness.fish", mode = "644" },
    { source = "target/completions/_badness", dest = "/usr/share/zsh/vendor-completions/_badness", mode = "644" },
]

[[bench]]
name = "formatting"
harness = false

[[bench]]
name = "keystroke"
harness = false

[[bench]]
name = "reparse"
harness = false

[[bench]]
name = "lsp_memory"
harness = false

[profile.release]
strip = "symbols"

[dev-dependencies]
insta = "1.47.2"
tempfile = "3.27.0"
