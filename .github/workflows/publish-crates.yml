name: Publish Crates

on:
  workflow_dispatch:
  push:
    tags:
      # The CLI stream plus the member-crate streams: `cargo workspaces publish
      # --skip-published` uploads whatever workspace versions are missing, in
      # dependency order, so library releases publish without waiting for the
      # next CLI tag. None of these runs upload GitHub release assets.
      - "v*"
      - "badness-parser-v*"
      - "badness-formatter-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release # Optional: for enhanced security
    permissions:
      id-token: write # Required for OIDC token exchange
    steps:
      - uses: actions/checkout@v7

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --locked

      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo workspaces publish --from-git --skip-published --no-verify --yes
