name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

      # `badness-formatter`'s `serde`/`schema` features are off by default, so
      # the workspace run above never compiles them. They are what the dprint
      # plugin borrows its published config schema from.
      - name: Run formatter feature tests
        run: cargo test -p badness-formatter --features schema --verbose

  wasm:
    if: github.event_name != 'schedule'
    name: Wasm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # `badness-formatter` is meant to be embedded by a dprint Wasm plugin,
      # and `badness-parser` by other Wasm-hosted tools; `badness-wasm` is the
      # wasm-bindgen shim behind the docs playground. This job is what keeps
      # the library crates free of filesystem/thread/time dependencies.
      - name: Build library crates for wasm
        run: >
          cargo build -p badness-parser -p badness-formatter -p badness-wasm
          --release --target wasm32-unknown-unknown

      # The dprint plugin builds `badness-formatter` for wasm *with* `schema`,
      # so schemars has to stay wasm-clean too.
      - name: Build formatter with the schema feature for wasm
        run: >
          cargo build -p badness-formatter --features schema
          --release --target wasm32-unknown-unknown

  extension:
    name: VS Code Extension
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/code/package-lock.json

      - name: Install dependencies
        working-directory: editors/code
        run: npm ci

      # Type-checks against @types/vscode + vscode-languageclient and bundles
      # with esbuild. Mirrors the check-types + bundle steps that
      # vscode:prepublish runs at release time, so dependency bumps that break
      # the extension fail on the PR instead of at publish.
      - name: Compile extension
        working-directory: editors/code
        run: npm run compile

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, wasm, extension, cargo-audit, cargo-deny]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.versionary.outputs.release_created }}
      tag_name: ${{ steps.versionary.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - id: versionary
        uses: jolars/versionary@v0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  build-release-assets:
    name: Build & Upload Release Assets
    needs: versionary
    # Only the primary CLI stream (bare `v*` tags) may carry release assets;
    # the member-crate streams (`badness-parser-v*`, `badness-formatter-v*`,
    # `badness-code-v*`) must not upload any.
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/packages.yml
    with:
      upload: "true"
      tag: ${{ needs.versionary.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write # mint the OIDC token for keyless provenance signing
      attestations: write # store the build provenance attestation

  publish-code-extensions:
    name: Publish Code Extensions
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-code-extensions.yml
    secrets: inherit
    permissions:
      contents: read

  publish-aur:
    name: Publish AUR Package
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ needs.versionary.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
