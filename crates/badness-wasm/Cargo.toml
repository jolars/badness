[package]
name = "badness-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "wasm-bindgen shim exposing the badness formatter for the docs playground"

# `rlib` alongside `cdylib` lets the host-target `cargo test` link the crate's
# unit tests; the browser bundle uses only the `cdylib`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
badness-formatter = { path = "../badness-formatter" }
badness-parser = { path = "../badness-parser" }
wasm-bindgen = "0.2.106"

# wasm-pack's bundled wasm-opt is a downloaded prebuilt binary that does not run
# on NixOS; skip it so local builds and CI produce the same artifact.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
