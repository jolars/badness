[book]
title = "Badness"
authors = ["Johan Larsson"]
description = "Badness is a formatter, linter, and language server for LaTeX."
language = "en"

[output.html]
smart-punctuation = true
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jolars/badness"
edit-url-template = "https://github.com/jolars/badness/edit/main/docs/{path}"
# The chart renderer loads its vendored runtime only on pages with charts.
additional-js = [
    "theme/bench-charts.js",
    "theme/playground-nav.js",
    "theme/accessibility.js",
]
additional-css = ["theme/bench-charts.css", "theme/brand.css", "theme/playground-nav.css", "theme/accessibility.css"]

[output.html.redirect]
"/reference/wrap-modes.html" = "configuration.html#wrap"
"/playground.html" = "playground/index.html"
# The four per-subsystem development pages were merged into Architecture.
"/development/parser.html" = "architecture.html#the-parser"
"/development/formatter.html" = "architecture.html#the-formatter"
"/development/linter.html" = "architecture.html#the-linter"
"/development/lsp.html" = "architecture.html#the-language-server"

[preprocessor]

[preprocessor.doc-utils]
command = "cargo run --quiet --manifest-path doc-utils/Cargo.toml"
optional = true
